version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: ai_interviewer_backend_prod
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      # Supplied from the host environment / .env — no insecure fallback.
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set (32+ chars, high entropy)}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-apppassword}@postgres:5432/${POSTGRES_DB:-ai_interviewer}
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS=true
      # STORAGE_TYPE / UPLOAD_DIR are the names the app actually reads
      # (app/core/config.py; app/api/v1/resume.py writes under UPLOAD_DIR).
      # This used to set STORAGE_LOCAL_PATH, which nothing reads -- so uploads
      # kept going to the image's own ./data/uploads while the volume below sat
      # empty, and every resume a candidate uploaded was lost on restart.
      - STORAGE_TYPE=local
      - UPLOAD_DIR=/app/data/storage/uploads
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_DEFAULT_MODEL=${GEMINI_DEFAULT_MODEL:-gemini-3.5-flash-lite}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      # Local CPU inference bounds and interviewer voice: see .env.example.
      - INTERVIEWER_VOICE_ID=${INTERVIEWER_VOICE_ID:-en_us_female_senior}
      - TTS_MAX_CONCURRENCY=${TTS_MAX_CONCURRENCY:-2}
      - STT_MAX_CONCURRENCY=${STT_MAX_CONCURRENCY:-2}
      - ENABLE_BACKGROUND_SCRAPER=${ENABLE_BACKGROUND_SCRAPER:-false}
    volumes:
      - storage_data:/app/data/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/readiness', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      # Local voice models are warmed at boot; do not fail the container while
      # that is still happening.
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_net

  # No `worker` service.
  #
  # There used to be one here running an archived lifecycle module by hand.
  # That module lives under the app archive directory, has no __main__ entry point and no
  # runner, so the command imported it and exited 0 immediately -- and with
  # `restart: unless-stopped` Docker restarted it forever, processing no jobs at
  # any point. The API container does its own background work in-process (the JD
  # scraper takes a single-instance lock), so nothing is lost by removing it.
  #
  # Redis stays: app/matching/jd_scraper.py uses it as the scrape cache.

  postgres:
    image: postgres:15-alpine
    container_name: ai_interviewer_postgres_prod
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-appuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-apppassword}
      - POSTGRES_DB=${POSTGRES_DB:-ai_interviewer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-ai_interviewer}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  redis:
    image: redis:7-alpine
    container_name: ai_interviewer_redis_prod
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

volumes:
  postgres_data:
  redis_data:
  storage_data:

networks:
  internal_net:
    driver: bridge
